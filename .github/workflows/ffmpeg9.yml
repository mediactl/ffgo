# The whole test suite on the FFmpeg releases the mediactl fork supports.
#
# 9.0's struct layouts differ from the Go offsets (written for 6/7), so its
# shim is built against 9.0's headers and ffgo reads structs through it. The
# distribution jobs (Debian 12's FFmpeg 5.1, Ubuntu 24.04's 6.1) hold the
# fork to upstream's releases, each with a shim built against its headers.
# ci.yml runs only on master/main; this workflow runs on the fork's
# branches too.
name: FFmpeg 9

on:
  push:
    branches: [master, main, 'clustarr/**']
  pull_request:
    branches: [master, main]

jobs:
  test-ffmpeg9-linux:
    runs-on: ubuntu-latest
    name: Test (Linux amd64, FFmpeg 9.0)
    env:
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-linux64-gpl-shared-9.0.tar.xz
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install the libraries BtbN's build loads at run time
        # BtbN links libva and the Vulkan loader through generated stubs that
        # abort the process when the library is missing; the hardware-device
        # probes (AvailableHWDeviceTypes) reach them.
        run: |
          sudo apt-get update
          sudo apt-get install -y libva2 libva-drm2 libva-x11-2 libvulkan1

      - name: Install FFmpeg 9.0 shared libraries and headers
        run: |
          curl -fsSL -o /tmp/ffmpeg.tar.xz "$FFMPEG_URL"
          sudo mkdir -p /opt/ffmpeg
          sudo tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C /opt/ffmpeg
          /opt/ffmpeg/bin/ffmpeg -hide_banner -version | head -1
          echo "/opt/ffmpeg/bin" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=/opt/ffmpeg/lib" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=/opt/ffmpeg/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build the shim against FFmpeg 9.0
        working-directory: shim
        run: ./build.sh

      - name: Run tests
        run: go test -v -count=1 ./...
        env:
          CGO_ENABLED: "0"
          FFGO_FFMPEG_MAJOR: "9"
          FFGO_SHIM_DIR: ${{ github.workspace }}/shim

  test-distribution-ffmpeg:
    runs-on: ubuntu-latest
    name: Test (${{ matrix.image }})
    strategy:
      fail-fast: false
      matrix:
        image: ["debian:12", "ubuntu:24.04"]
    container: ${{ matrix.image }}
    steps:
      - name: Install FFmpeg, its headers and a C compiler
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git gcc libc6-dev pkg-config ffmpeg \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libswresample-dev libavfilter-dev libavdevice-dev

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the shim against the distribution's FFmpeg
        working-directory: shim
        run: ./build.sh

      - name: Run tests
        run: go test -count=1 ./...
        env:
          CGO_ENABLED: "0"
          FFGO_SHIM_DIR: ${{ github.workspace }}/shim
