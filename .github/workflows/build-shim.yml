# Build ffshim for all supported platforms
# This workflow builds the shim library on native runners for maximum compatibility
#
# The two Linux shims are built against BtbN's FFmpeg 9.0 shared build (the
# release the mediactl fork supports; see ffmpeg9.yml), not the runner's
# distribution packages: a shim reads FFmpeg's structs at the offsets of the
# headers it was compiled with, and the arm64 job's multiarch apt install
# broke on 2026-10-27 when ubuntu-latest became 26.04 and ports.ubuntu.com
# lagged the amd64 archive, so apt wanted to downgrade 109 amd64 packages
# ("Packages were downgraded and -y was used without --allow-downgrades").
# The tarball's .pc files are relocatable (prefix=${pcfiledir}/../..), so
# pkg-config pointed at its lib/pkgconfig serves native and cross builds alike.
name: Build Shim

env:
  FFMPEG_BRANCH: "9.0"
  FFMPEG_RELEASE: latest

on:
  push:
    branches: [master, main]
    paths:
      - 'shim/**'
      - '.github/workflows/build-shim.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'shim/**'
      - '.github/workflows/build-shim.yml'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Upload artifacts even on non-release builds'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

jobs:
  build-linux-amd64:
    runs-on: ubuntu-latest
    name: Build (linux/amd64)
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg ${{ env.FFMPEG_BRANCH }} shared libraries and headers
        run: |
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/ffmpeg-n${FFMPEG_BRANCH}-latest-linux64-gpl-shared-${FFMPEG_BRANCH}.tar.xz"
          curl -fsSL -o /tmp/ffmpeg.tar.xz "$url"
          sudo mkdir -p /opt/ffmpeg
          sudo tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C /opt/ffmpeg
          PKG_CONFIG_LIBDIR=/opt/ffmpeg/lib/pkgconfig pkg-config --modversion libavutil

      - name: Build shim
        working-directory: shim
        env:
          PKG_CONFIG_LIBDIR: /opt/ffmpeg/lib/pkgconfig
        run: ./build.sh prebuilt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shim-linux-amd64
          path: shim/prebuilt/linux-amd64/

  build-linux-arm64:
    runs-on: ubuntu-latest
    name: Build (linux/arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install the arm64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu pkg-config

      - name: Install arm64 FFmpeg ${{ env.FFMPEG_BRANCH }} shared libraries and headers
        # The arm64 tarball is only linked against, never run: its libraries
        # resolve the shim's symbols for the cross linker, and its headers are
        # the struct layouts the shim is compiled with.
        run: |
          url="https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_RELEASE}/ffmpeg-n${FFMPEG_BRANCH}-latest-linuxarm64-gpl-shared-${FFMPEG_BRANCH}.tar.xz"
          curl -fsSL -o /tmp/ffmpeg.tar.xz "$url"
          sudo mkdir -p /opt/ffmpeg-arm64
          sudo tar -xJf /tmp/ffmpeg.tar.xz --strip-components=1 -C /opt/ffmpeg-arm64
          PKG_CONFIG_LIBDIR=/opt/ffmpeg-arm64/lib/pkgconfig pkg-config --modversion libavutil

      - name: Build shim
        working-directory: shim
        env:
          PKG_CONFIG_LIBDIR: /opt/ffmpeg-arm64/lib/pkgconfig
        run: |
          libs="libavutil libavcodec libavformat libavdevice libavfilter"
          mkdir -p prebuilt/linux-arm64
          aarch64-linux-gnu-gcc -shared -fPIC -Wall -Wextra -O2 \
            -DFFSHIM_HAVE_AVDEVICE=1 -DFFSHIM_HAVE_AVFILTER=1 \
            $(pkg-config --cflags $libs) \
            -o prebuilt/linux-arm64/libffshim.so ffshim.c \
            $(pkg-config --libs $libs)
          file prebuilt/linux-arm64/libffshim.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shim-linux-arm64
          path: shim/prebuilt/linux-arm64/

  # Build on macOS (both amd64 and arm64 native)
  build-macos-amd64:
    runs-on: macos-15-intel
    name: Build (darwin/amd64)
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Build shim
        working-directory: shim
        run: |
          make native
          mkdir -p prebuilt/darwin-amd64
          cp libffshim.dylib prebuilt/darwin-amd64/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shim-darwin-amd64
          path: shim/prebuilt/darwin-amd64/

  build-macos-arm64:
    runs-on: macos-15
    name: Build (darwin/arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Install FFmpeg
        run: brew install ffmpeg

      - name: Build shim
        working-directory: shim
        run: |
          make native
          mkdir -p prebuilt/darwin-arm64
          cp libffshim.dylib prebuilt/darwin-arm64/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shim-darwin-arm64
          path: shim/prebuilt/darwin-arm64/

  # Build on Windows
  build-windows-amd64:
    runs-on: windows-latest
    name: Build (windows/amd64)
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ffmpeg
            pkg-config

      - name: Build shim
        shell: msys2 {0}
        working-directory: shim
        run: |
          make native
          mkdir -p prebuilt/windows-amd64
          cp ffshim.dll prebuilt/windows-amd64/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shim-windows-amd64
          path: shim/prebuilt/windows-amd64/

  # Combine all artifacts into a single release asset
  package:
    needs: [build-linux-amd64, build-linux-arm64, build-macos-amd64, build-macos-arm64, build-windows-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package shims
        run: |
          mkdir -p release/shim/prebuilt

          # Copy all platform shims
          for dir in artifacts/shim-*/; do
            platform=$(basename "$dir" | sed 's/shim-//')
            if [ -d "$dir" ] && [ "$(ls -A "$dir")" ]; then
              mkdir -p "release/shim/prebuilt/$platform"
              cp -r "$dir"/* "release/shim/prebuilt/$platform/"
            fi
          done

          # Create archive
          cd release
          tar -czvf ../ffshim-prebuilt.tar.gz shim/
          cd ..

          # Create checksums
          sha256sum ffshim-prebuilt.tar.gz > ffshim-prebuilt.tar.gz.sha256

      - name: Upload release asset
        # Avoid "skipped" steps: always run and no-op on non-release events.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" != "release" ]; then
            echo "Not a release event (${GITHUB_EVENT_NAME}); skipping release upload."
            exit 0
          fi

          tag="${GITHUB_REF_NAME}"
          echo "Uploading prebuilt shims to release ${tag}..."
          gh release upload "${tag}" ffshim-prebuilt.tar.gz ffshim-prebuilt.tar.gz.sha256 --clobber

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffshim-prebuilt
          path: |
            ffshim-prebuilt.tar.gz
            ffshim-prebuilt.tar.gz.sha256
